<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topas Optical Persada</title>
    <style>
        /* Mengatur agar halaman penuh tanpa jarak pinggir */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Mencegah munculnya scrollbar ganda */
            background-color: #f4f4f9; /* Warna background opsional */
        }

        /* Mengatur iframe agar memenuhi 100% layar HP atau Laptop */
        .app-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe class="app-container" src="https://script.google.com/macros/s/AKfycbxc4V8j1XpFxVEZqBEVC6Ta_kOIaM3j308w7dVV_58Jk9h9zzNiw4xwmNEM9xLaBJUE/exec" allowfullscreen></iframe>

</body>
</html>
